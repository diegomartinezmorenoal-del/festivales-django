<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Festivales{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f8; color: #222; }
        header { background: #4b2e83; padding: 15px 30px; }
        header a { color: white; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .tarjeta { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px;
                   box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
        h1, h2, h3 { color: #4b2e83; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        a { color: #4b2e83; }
    </style>
</head>
<body>
    <header><a href="{% url 'index' %}">Festivales Django</a></header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
